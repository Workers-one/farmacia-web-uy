version: '3.1'
services:
  db:
    image: postgres:15
    container_name: odoo-db
    restart: always
    environment:
      POSTGRES_DB: odoo
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo_password
    ports:
      - "5432:5432"
    volumes:
      - odoo-db-data:/var/lib/postgresql/data

  odoo:
    image: odoo:18.0
    container_name: odoo-app
    restart: always
    depends_on:
      - db
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo_password
    ports:
      - "8069:8069"
    volumes:
      - ./odoo-addons:/mnt/extra-addons

volumes:
  odoo-db-data:
FROM odoo:18.0

Configurar el usuario

USER root

Instalar dependencias adicionales si son necesarias

RUN apt-get update && apt-get install -y 
nano 
git 
unzip 
&& rm -rf /var/lib/apt/lists/*

Crear directorio para los addons personalizados

RUN mkdir -p /mnt/extra-addons && chown -R odoo:odoo /mnt/extra-addons

Copiar los addons personalizados al contenedor

COPY ./odoo-addons /mnt/extra-addons

Cambiar permisos

RUN chown -R odoo:odoo /mnt/extra-addons

Cambiar a usuario Odoo

USER odoo

Exponer puerto de Odoo

EXPOSE 8069

Comando de inicio

CMD ["odoo"]

